<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600">
<defs>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#C9E0FB" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#DDEBFC" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3C95F4"/><stop offset="0.55" stop-color="#1E7CE8"/><stop offset="1" stop-color="#0D4A96"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#E4F0FD"/><stop offset="1" stop-color="#9CC8F6"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAFE"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9CC8F6"/><stop offset="1" stop-color="#D6E8FC"/>
  </linearGradient>
  <linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1E7CE8"/><stop offset="1" stop-color="#0D4A96"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF5A78"/><stop offset="0.5" stop-color="#FE2C55"/><stop offset="1" stop-color="#D9134A"/>
  </linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9CC8F6"/><stop offset="0.5" stop-color="#1E7CE8"/><stop offset="1" stop-color="#0D4A96"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0D4A96" flood-opacity="0.18"/></filter>
  <filter id="shR" x="-40%" y="-30%" width="180%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#FE2C55" flood-opacity="0.32"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="cBlue"><rect x="150" y="100" width="352" height="246" rx="30"/></clipPath>
</defs>

<ellipse cx="400" cy="300" rx="350" ry="260" fill="url(#glow)"/>

<!-- 后层：Studio 蓝渐变卡 -->
<g transform="rotate(-8 326 223)">
  <rect x="150" y="100" width="352" height="246" rx="30" fill="url(#blue)"/>
  <g clip-path="url(#cBlue)" fill="none" stroke="#FFFFFF">
    <circle cx="470" cy="330" r="120" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="470" cy="330" r="180" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="470" cy="330" r="240" stroke-opacity="0.06" stroke-width="2"/>
