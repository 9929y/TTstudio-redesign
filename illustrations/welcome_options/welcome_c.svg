  <rect x="150" y="100" width="352" height="246" rx="30" fill="url(#sheen)"/>
  <rect x="180" y="128" width="96" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="180" y="152" width="58" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.3"/>
</g>

